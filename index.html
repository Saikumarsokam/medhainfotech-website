<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#101c2c">
	<title>Coming Soon | Medha Infotech</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: #f5f8fc;
			background: radial-gradient(ellipse at 78% 18%, #173b55 0, transparent 36%),
									radial-gradient(ellipse at 12% 88%, #183b43 0, transparent 34%), #101c2c;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		main {
			width: min(100%, 760px);
			padding: clamp(36px, 8vw, 76px);
			text-align: center;
			border: 1px solid rgba(255,255,255,.12);
			border-radius: 28px;
			background: rgba(255,255,255,.045);
			box-shadow: 0 24px 80px rgba(0,0,0,.25);
		}
		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 52px;
			color: #eaf2f8;
			font-size: 14px;
			font-weight: 700;
			letter-spacing: .12em;
			text-transform: uppercase;
		}
		.brand-mark {
			display: grid;
			width: 34px;
			height: 34px;
			place-items: center;
			border-radius: 11px;
			color: #10202c;
			background: #77e0cb;
			font-size: 18px;
			letter-spacing: 0;
		}
		.eyebrow {
			margin: 0 0 18px;
			color: #77e0cb;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: .2em;
			text-transform: uppercase;
		}
		h1 {
			max-width: 620px;
			margin: 0 auto 20px;
			font-size: clamp(44px, 9vw, 78px);
			line-height: .98;
			letter-spacing: -.065em;
		}
		h1 span { color: #77e0cb; }
		.description {
			max-width: 460px;
			margin: 0 auto 34px;
			color: #b6c4d1;
			font-size: 16px;
			line-height: 1.7;
		}
		.status {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 12px 18px;
			border: 1px solid rgba(119,224,203,.25);
			border-radius: 999px;
			color: #d9e7ed;
			background: rgba(119,224,203,.07);
			font-size: 13px;
		}
		.dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #77e0cb;
			box-shadow: 0 0 14px #77e0cb;
		}
		footer {
			margin-top: 54px;
			color: #8193a3;
			font-size: 12px;
		}
		@media (max-width: 480px) {
			main { border-radius: 20px; }
			.brand { margin-bottom: 42px; }
			footer { margin-top: 42px; }
		}
	</style>
</head>
<body>
	<main>
		<div class="brand"><span class="brand-mark" aria-hidden="true">M</span> Medha Infotech</div>
		<p class="eyebrow">Something good is in the works</p>
		<h1>We’re <span>coming soon.</span></h1>
		<p class="description">We’re putting the finishing touches on our new website. Check back soon to see what we’ve been building.</p>
		<div class="status"><span class="dot" aria-hidden="true"></span> A fresh experience is on its way</div>
		<footer>© <span id="year">2025</span> Medha Infotech. All rights reserved.</footer>
	</main>
	<script>
		document.getElementById('year').textContent = new Date().getFullYear();
	</script>
</body>
</html>
